name: Deploy payment request tool to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "tao-dntt/web/**"
      - "hdb-ui.css"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Include shared HDB UI stylesheet
        run: cp hdb-ui.css tao-dntt/web/hdb-ui.css
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: tao-dntt/web
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages
